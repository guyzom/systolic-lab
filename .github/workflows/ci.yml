name: Tests and reproducible artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test simulator and live HTTP API
        run: python -m unittest discover -s tests -v
      - name: Regenerate the teaching example and experiment results
        run: |
          python -m systolic_lab simulate --input examples/tiny.json --rows 2 --cols 2 --bandwidth 8 --latency 1 --trace --output results/tiny-trace.json
          python -m experiments.tiny
          python -m experiments.run
      - name: Verify committed artifacts reproduce exactly
        run: git diff --exit-code -- results/
